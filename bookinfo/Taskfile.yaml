version: "3"

tasks:
    build-backend-image:
        desc: "Builds the BookInfo backend Docker image"
        dir: ./backend
        vars:
            APP_VERSION:
                sh: ./gradlew properties -q | awk '/^version:/ {print $2}'
            IMAGE_VERSION: "{{.APP_VERSION| default latest }}"
        cmd: docker build -t fbrandes-library/bookinfo-frontend:${APP_VERSION} .
    build-frontend-image:
        desc: "Builds the Book Info frontend Docker image"
        dir: ./frontend
        vars:
            APP_VERSION:
                sh: cat package.json | jq -r '.version'
            IMAGE_VERSION: "{{.APP_VERSION| default latest }}"
        cmd: docker build -t fbrandes-library/bookinfo-backend:${APP_VERSION} .
