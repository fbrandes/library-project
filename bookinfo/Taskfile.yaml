version: "3"

vars:
  DOCKER_IMAGE_REPOSITORY: fbrandes-library

tasks:
  build:
    desc: "Builds the Book Info service"
    cmds:
      - task: build-backend
      - task: build-backend-image
      - task: build-frontend
      - task: build-frontend-image

  build-backend:
    desc: "Builds the Book Info backend"
    deps: [setup-gradle]
    dir: ./backend
    cmd: ./gradlew build -x test

  build-backend-image:
    desc: "Builds the BookInfo backend Docker image"
    dir: ./backend
    vars:
      APP_VERSION:
        sh: ./gradlew properties -q | awk '/^version:/ {print $2}'
      IMAGE_VERSION: "{{.APP_VERSION| default latest }}"
    cmd: docker build -t {{.DOCKER_IMAGE_REPOSITORY}}/bookinfo-frontend:${APP_VERSION} .

  build-frontend:
    desc: "Builds the Book Info frontend"
    deps: [setup-node]
    dir: ./frontend
    cmd: pnpm run build

  build-frontend-image:
    desc: "Builds the Book Info frontend Docker image"
    dir: ./frontend
    vars:
      APP_VERSION:
        sh: cat package.json | jq -r '.version'
      IMAGE_VERSION: "{{.APP_VERSION| default latest }}"
    cmd: docker build -t {{.DOCKER_IMAGE_REPOSITORY}}/bookinfo-backend:${APP_VERSION} .
