services:
  user-management-ui:
    build:
      context: ..
      dockerfile: user-management/frontend/Dockerfile
    ports:
      - "5175:80"
    depends_on:
      - user-management

  user-management:
    build:
      context: ..
      dockerfile: user-management/backend/Dockerfile
    environment:
      USER_MANAGEMENT_PORT: "8080"
      USER_MANAGEMENT_DATABASE_URL: postgres://user_management:user_management@user-management-postgres:5432/user_management
    ports:
      - "8083:8080"
    depends_on:
      user-management-postgres:
        condition: service_healthy

  user-management-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: user_management
      POSTGRES_USER: user_management
      POSTGRES_PASSWORD: user_management
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - user-management-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  user-management-postgres-data:
