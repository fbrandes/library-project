name: Pull Request

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  checks: write
  pull-requests: write
  actions: read
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install Task
        uses: arduino/setup-task@v3
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Run Super Linter
        run: task lint
  check-api-compatibility:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        api-spec:
          - bookinfo.yml
          - renting.yml
          - user-management.json
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install Task
        uses: arduino/setup-task@v3
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Check API compatibility
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: task cicd:open-api-diff API_SPEC_FILE=${{matrix.api-spec}}
