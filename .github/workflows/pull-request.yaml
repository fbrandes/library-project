name: Pull Request

on:
  pull_request:
    types: [ opened, reopened, synchronize ]
  push:
    branches: [ main ]

permissions:
  checks: write
  pull-requests: write
  actions: read
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          token: '${{ steps.app-token.outputs.token }}'
      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
      - name: Run Super Linter
        run: task lint
  check-api-compatibility:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        api-spec:
          - bookinfo.yml
          - renting.yml
          - user-management.yml
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          token: '${{ steps.app-token.outputs.token }}'
      - name: Check API compatibility
        run: task open-api-diff API_SPEC_FILE=${{matrix.api-spec}}

