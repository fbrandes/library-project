server:
    port: 8080

spring:
    application:
        name: gateway
    security:
        oauth2:
            resourceserver:
                jwt:
                    issuer-uri: ${GATEWAY_OAUTH2_ISSUER_URI:http://keycloak:8080/realms/library}
    cloud:
        gateway:
            server:
                webflux:
                    routes:
                        -   id: bookinfo-api
                            uri: ${BOOKINFO_API_URI:http://bookinfo:8080}
                            predicates:
                                - Path=/api/bookinfo/**
                            filters:
                                - StripPrefix=2
                        -   id: renting-api
                            uri: ${RENTING_API_URI:http://renting:8080}
                            predicates:
                                - Path=/api/renting/**
                            filters:
                                - StripPrefix=2
                        -   id: user-management-api
                            uri: ${USER_MANAGEMENT_API_URI:http://user-management:8080}
                            predicates:
                                - Path=/api/user-management/**
                            filters:
                                - StripPrefix=2
                        -   id: bookinfo-ui
                            uri: ${BOOKINFO_UI_URI:http://bookinfo-ui:80}
                            predicates:
                                - Path=/bookinfo/**
                            filters:
                                - StripPrefix=1
                        -   id: renting-ui
                            uri: ${RENTING_UI_URI:http://renting-ui:80}
                            predicates:
                                - Path=/renting/**
                            filters:
                                - StripPrefix=1
                        -   id: user-management-ui
                            uri: ${USER_MANAGEMENT_UI_URI:http://user-management-ui:80}
                            predicates:
                                - Path=/user-management/**
                            filters:
                                - StripPrefix=1

management:
    endpoints:
        web:
            base-path: /
            exposure:
                include: health,info
    info:
        env:
            enabled: true

info:
    app:
        name: gateway
